version: 2
updates:
  - package-ecosystem: "npm" #
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      # Bundle low-risk minor + patch bumps into a single PR. Major bumps are
      # left out so they still arrive as individual, reviewable PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint 8.x only supports TypeScript <6.1 (and .npmrc's
      # legacy-peer-deps hides the peer conflict), so hold TS on 6.0.x.
      # Remove once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
